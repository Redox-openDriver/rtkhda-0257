name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: the tag names the driver version
        run: test "v$(sed -n 's/^version = "\(.*\)"$/\1/p' driver.toml | head -n 1)" = "$GITHUB_REF_NAME"
      - name: source archive
        run: |
          name="${GITHUB_REPOSITORY#*/}-$GITHUB_REF_NAME"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "$name.tar.gz" > SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS
