[package]
name = "rtkhda-linux"
version = "0.1.0"
description = "Звук Realtek ALC257 ноутбука Lenovo ThinkBook 21KK на Linux: что сделал бы драйвер, по дампу кодека из /proc, без доступа к железу"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sonus = { git = "https://github.com/Redox-openDriver/sonus", tag = "v0.1.0", features = ["procfs"] }
drv-i18n = { git = "https://github.com/Redox-openDriver/drv-i18n", tag = "v0.1.1" }
libc = "0.2"

[[bin]]
name = "rtkhda-dev"
path = "src/bin/rtkhda-dev.rs"
